<!DOCTYPE html>
<html>
    <head>
        <title>Methods</title>
    </head>
    <body>
        <h2>Methods in JS</h2>
        <script>//javascript code
            //create a variable
            var ego='IntRoDucTion';
            var introduction='EgO';
            //display an output
            document.write(ego.toUpperCase());
            //line break
            document.write("<br>");
            document.write(introduction.toUpperCase());
            //line break
            document.write("<br>")
            document.write(ego.toUpperCase());
            document.write("<br>")
            document.write(introduction.startsWith('E'));
        </script>
    </body>
</html>
