<!DOCTYPE html>
<html>
    <head>
        <title>Loops</title>
    </head>
    <body>
        <h2>LOOPS IN JS</h2>
        <p id="demo"></p>

        <script>
            var fruits = ["Apples","Oranges","Watermelons","Pinnaples"]
            var text ="";//display
            //loop
            for(i=0;i<fruits.length;i++){
                text+=fruits[i] + "<br>";//display a list of fruits
            }
            document.getElementById("demo").innerHTML=text;
        </script>
    </body>
</html>
